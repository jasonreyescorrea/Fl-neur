<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flâneur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Independent coffee shops worth walking to, in Boston, Sacramento, New York, San Francisco and Mexico City.">
<meta name="theme-color" content="#DEDEDC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Covered+By+Your+Grace&display=swap">
<style>
/* Flâneur: black ink on one plain off-white page. Nothing else for now.
   Type: Schibsted Grotesk; Covered By Your Grace stands in for the hand-lettered logo until the real one
   is ready. Both free from Google Fonts. */
:root {
  --paper: #FBFBF9;
  --ink: #151515;
  --muted: #6E6E6B;     /* 5:1 on the paper */
  --hair: #CFCFCB;
  --rule: #9C9C98;
  --gutter: clamp(14px, 1.6vw, 22px);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-hand: "Covered By Your Grace", "Bradley Hand", cursive;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 1.35; letter-spacing: -.005em; -webkit-font-smoothing: antialiased;
  padding: max(clamp(16px, 6vh, 72px), env(safe-area-inset-top, 0px)) max(clamp(12px, 5vw, 80px), env(safe-area-inset-right, 0px)) clamp(24px, 6vh, 72px) max(clamp(12px, 5vw, 80px), env(safe-area-inset-left, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 500; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sheet { position: relative; max-width: 1180px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gutter); }

/* the head of the sheet */
.head { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-bottom: clamp(28px, 5vw, 56px); }
.logo { line-height: .8; }
/* LOGO SLOT: replace .logo-word with the final hand-lettered logo (SVG) when it is ready */
.logo-word { display: block; font-family: var(--font-hand); font-size: 30px; text-transform: uppercase; letter-spacing: .01em; transform: rotate(-3deg) scaleY(1.15); }
.head .nav { justify-content: center; display: flex; flex-wrap: wrap; gap: 2px 16px; font-weight: 500; font-size: 11px; line-height: 1.3; padding-top: 6px; }
.nav a { color: var(--muted); transition: color .2s; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }

/* a field: small grey label, a hairline, the value */
.field { border-top: 1px solid var(--hair); padding-top: 5px; min-width: 0; }
.val { font-weight: 500; font-size: 14px; line-height: 1.2; }

/* the picture: the flâneur, drawn in pencil on grey */
/* the flâneur: a two-tone stencil portrait (flaneur.png), black ground and white highlights */
.portrait { display: block; margin: 0 auto; width: min(460px, 100%); height: auto; }


.body { align-items: start; padding-top: 16px; }
.pic { grid-column: 1 / -1; }
.city-name { grid-column: 1 / -1; text-align: center; font-family: var(--font-hand); font-weight: 400; text-transform: uppercase; font-size: clamp(56px, 9vw, 128px); line-height: .9; letter-spacing: .01em; transform: rotate(-2deg) scaleY(1.1); }
.city-name:focus { outline: none; }

/* the cafés, as rows of fields */
.shops { list-style: none; margin: clamp(36px, 6vw, 64px) auto 0; padding: 0; max-width: 420px; text-align: center; }
.shop { position: relative; padding-block: 0 26px; opacity: 0; transform: translateY(10px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: var(--d, 0ms); }
.shop.in { opacity: 1; transform: none; }
.shop { border-top: 1px solid var(--rule); padding-top: 16px; }
.shop .val { margin-top: 6px; }
.shop h2 { font-weight: 600; font-size: 20px; line-height: 1.15; letter-spacing: -.01em; }
.shop .val { font-size: 20px; font-weight: 400; line-height: 1.15; color: var(--muted); }
.shop a::after { content: ""; position: absolute; inset: 0; }
.shop:hover h2, .shop:has(a:focus-visible) h2 { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.shop a:focus-visible { outline: none; }
.shop:has(a:focus-visible) { outline: 2px solid var(--ink); outline-offset: 4px; }

main:not([hidden]) { animation: view-in .5s var(--ease) both; }
@keyframes view-in { from { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

@media (max-width: 760px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pic { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .shop { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<article class="sheet">
  <header class="head">
    <a class="logo" href="#home" aria-label="Flâneur, home"><span class="logo-word" aria-hidden="true">Flâneur</span></a>
    <nav class="nav" aria-label="Cities" id="tabs"></nav>
  </header>

  <main id="home-view" hidden>
    <h1 class="sr-only">Flâneur</h1>
    <div class="grid body">
      <div class="pic"><img class="portrait" src="flaneur.png" width="660" height="850" alt="Black and white stencil portrait of a flâneur in a bowler hat, smoking a cigarette"></div>
    </div>
  </main>

  <main id="city-view" hidden>
    <div class="grid body">
      <h1 class="city-name" id="city-title" tabindex="-1"></h1>
    </div>
    <ul class="shops" id="shops"></ul>
  </main>

</article>

<script>
// Independent specialty shops rated 4.0+ on Yelp, Nov 2026.
// One café per city, kept on purpose.
const CITIES = [
  { id: "boston", name: "Boston", shops: [{ name: "Cicada Coffee Bar", hood: "Cambridge" }] },
  { id: "sacramento", name: "Sacramento", shops: [{ name: "Camellia Coffee", hood: "R Street" }] },
  { id: "nyc", name: "New York", shops: [{ name: "Arcane Estate Coffee", hood: "West Village" }] },
  { id: "sf", name: "San Francisco", shops: [{ name: "Golden Goat Coffee", hood: "SoMa" }] },
  { id: "cdmx", name: "Ciudad de México", shops: [{ name: "El Minutito", hood: "Juárez" }] }
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { city: null }; // null = home page
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);
function pickView() { state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null; }


function renderNav() {
  const items = CITIES.map((c) => ({ id: c.id, label: c.name, sel: state.city === c }));
  $("tabs").innerHTML = items.map((t) => `<a href="#${t.id}"${t.sel ? ' aria-current="page"' : ""}>${esc(t.label)}</a>`).join("");
}

function renderIntro() {
}

const reveal = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); } });
}, { rootMargin: "0px 0px -6% 0px" }) : null;

function renderCity() {
  const c = state.city;
  $("city-title").textContent = c.name;
  $("shops").innerHTML = c.shops.map((s, i) => `
    <li class="shop" style="--d:${Math.min(i, 6) * 70}ms">
      <h2><a href="${mapsUrl(s, c)}" target="_blank" rel="noopener">${esc(s.name)}<span class="sr-only"> (opens Google Maps in a new tab)</span></a></h2>
      <p class="val">${esc(s.hood)}</p>
    </li>`).join("");
  document.querySelectorAll(".shop").forEach((el) => {
    if (!reveal || reduceMotion.matches) el.classList.add("in"); else reveal.observe(el);
  });
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.title = home ? "Flâneur" : `${state.city.name} · Flâneur`;
  renderNav();
  if (!home) renderCity();
}

window.addEventListener("hashchange", () => {
  pickView(); renderAll(); window.scrollTo(0, 0);
  // no page load happened, so move focus to the new city's heading for keyboard and screen reader users
  if (state.city) $("city-title").focus({ preventScroll: true });
});

pickView();
renderIntro();
renderAll();
</script>
</body>
</html>
