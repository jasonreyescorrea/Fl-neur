<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flâneur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Independent specialty coffee shops in Boston, Sacramento, New York, San Francisco and Mexico City.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Instrument+Serif:ital@0;1&family=Schoolbell&display=swap">
<style>
/* Type: PP Neue Montreal (sans) and PP Editorial New (serif) from Pangram Pangram.
   Drop the .woff2 files into a "fonts" folder next to this page and they take over.
   Until then the closest free look-alikes load: Inter Tight and Instrument Serif. */
@font-face { font-family: "PP Neue Montreal"; src: url("fonts/PPNeueMontreal-Book.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "PP Neue Montreal"; src: url("fonts/PPNeueMontreal-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "PP Editorial New"; src: url("fonts/PPEditorialNew-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "PP Editorial New"; src: url("fonts/PPEditorialNew-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }

:root {
  --bg: #FFFFFF;
  --surface: #F6F6F4;
  --ink: #0A0A0A;
  --muted: #6B6B6B;
  --line: #E3E3E3;
  /* the only color on the site: café names on the reel tiles */
  --on-ink-red: #F28B82; --on-ink-blue: #8AB4F8; --on-ink-green: #81C995;
  --on-bg-red: #A3271F; --on-bg-blue: #1F4FA8; --on-bg-green: #2E6B34;
  --font-hand: "Schoolbell", "Bradley Hand", "Comic Sans MS", cursive;
  --font-sans: "PP Neue Montreal", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "PP Editorial New", "Instrument Serif", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #111111; --ink: #FFFFFF; --muted: #A3A3A3; --line: #2B2B2B;
    --on-ink-red: #A3271F; --on-ink-blue: #1F4FA8; --on-ink-green: #2E6B34; --on-bg-red: #F28B82; --on-bg-blue: #8AB4F8; --on-bg-green: #81C995;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #111111; --ink: #FFFFFF; --muted: #A3A3A3; --line: #2B2B2B;
  --on-ink-red: #A3271F; --on-ink-blue: #1F4FA8; --on-ink-green: #2E6B34; --on-bg-red: #F28B82; --on-bg-blue: #8AB4F8; --on-bg-green: #81C995;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-sans); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.label { font-size: 14px; letter-spacing: .01em; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Sticky header: brand and city tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { font-family: var(--font-hand); font-size: 28px; white-space: nowrap; text-decoration: none; }
/* The home page is just the intro: no header, no footer */
body[data-view="home"] .top, body[data-view="home"] footer { display: none; }

.tabs-box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; }
.tabs-scroll { flex: 1; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 4px; margin-bottom: -4px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%); }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; width: max-content; margin-left: auto; }
.tab { border-radius: 999px; padding: 5px 12px; font-size: 15px; white-space: nowrap; text-decoration: none; color: var(--muted); transition: color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.nudge { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 14px; line-height: 1; display: grid; place-items: center; padding: 0; }

/* Views fade in when you switch between home and a city */
main:not([hidden]) { animation: view-in .5s ease both; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } }

/* Intro: evenly spaced cities on top, the warped name centered on the screen */
.intro { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
.intro-nav { position: relative; z-index: 1; display: flex; justify-content: space-around; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) 0; font-family: var(--font-hand); font-size: 20px; }
.intro-nav a { text-decoration: none; white-space: nowrap; transition: opacity .2s; }
.intro-nav:hover a:not(:hover) { opacity: .35; }
.intro-nav .short { display: none; }
.intro-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.mark { display: flex; justify-content: center; font-family: var(--font-hand); font-weight: 400; font-size: min(23vw, 30vh); line-height: 1; padding-top: .5em; letter-spacing: .02em; -webkit-text-stroke: .045em currentColor; paint-order: stroke fill; }
.mark span { display: inline-block; margin-inline: .05em; transform-origin: 50% 88%;
  /* --t: -1 at the left edge, 0 in the middle, 1 at the right; --b: 1 in the middle, 0 at the edges */
  transform: skewX(calc(var(--t) * 24deg)) scaleY(calc(1 + var(--b) * .6)); }
/* City page: just the cafés, centered */
.shops { list-style: none; margin: 0 auto; padding: 56px 0 72px; max-width: 900px; }
.shop { border-top: 1px solid var(--line); opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0ms); }
.shop:last-child { border-bottom: 1px solid var(--line); }
.shop.in { opacity: 1; transform: none; }
.shop a { display: block; text-align: center; padding: 26px 0 24px; text-decoration: none; transition: opacity .25s; }
.shops:hover .shop a:not(:hover) { opacity: .35; }
.shop .nm { display: block; font-family: var(--font-serif); font-size: clamp(34px, 5.2vw, 68px); line-height: 1; letter-spacing: -.01em; }
.shop .meta { display: block; margin-top: 8px; font-size: 15px; color: var(--muted); }
.shop a:hover .nm, .shop a:focus-visible .nm { font-style: italic; }

footer { padding-block: 40px 48px; color: var(--muted); }
footer .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }

@media (max-width: 760px) {
  .top .wrap { flex-wrap: wrap; gap: 6px 12px; }
  .brand { flex: 1; }
  .tabs-box { order: 3; flex-basis: 100%; }
  .tabs { margin-left: 0; }
  .intro-nav { justify-content: space-between; }
  .intro-nav .full { display: none; }
  .intro-nav .short { display: inline; }
  .intro-nav { font-size: 18px; }
  .shops { padding-top: 32px; }
  .shop a { padding-block: 20px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  main:not([hidden]) { animation: none !important; }
  .shop { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#home">Flâneur</a>
    <div class="tabs-box">
      <button type="button" class="nudge" id="nudge-left" aria-label="Scroll cities left" hidden>←</button>
      <nav class="tabs-scroll" id="tabs-scroll" aria-label="Choose a city">
        <div class="tabs" id="tabs"></div>
      </nav>
      <button type="button" class="nudge" id="nudge-right" aria-label="Scroll cities right" hidden>→</button>
    </div>
  </div>
</header>

<main id="home-view" hidden>
  <section class="intro" id="intro">
    <nav class="intro-nav" id="intro-nav" aria-label="Cities, quick links"></nav>
    <div class="intro-stage">
      <h1 class="mark" id="mark" aria-label="Flâneur"></h1>
    </div>
  </section>
</main>

<main id="city-view" hidden>
  <!-- City name kept for screen readers only; the selected tab shows it visually -->
  <h1 class="sr-only" id="city-title"></h1>
  <section class="wrap" aria-label="Cafés">
    <ul class="shops" id="shops"></ul>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="label" style="margin:0">Boston · Sacramento · NYC · SF · CDMX</p>
  </div>
</footer>

<script>
// Independent specialty shops rated 4.0+ on Yelp, Nov 2026.
// blurb, note and the a{} scores are kept in the data but no longer shown.
const CITIES = [
  { id: "boston", name: "Boston", region: "Massachusetts", tz: "America/New_York",
    shops: [
      { name: "Cicada Coffee Bar", hood: "Cambridge", know: "Vietnamese coffee bar",
        blurb: "Vietnamese-inspired café just across the river, pouring Nguyen Coffee Supply beans. Named Boston Magazine's Best Coffee Shop in 2022 and 2023.",
        note: "Try the egg coffee or a cà phê sữa đá.", a: { work: 1, espresso: 2, pourover: 1, pastry: 2, cozy: 3, quick: 1 } },
      { name: "Gracenote Coffee", hood: "Leather District", know: "Espresso bar and roaster",
        blurb: "A small bar near South Station from a Boston roaster known for bright, carefully roasted coffee.",
        note: "Tiny room. Take it to go and walk.", a: { work: 0, espresso: 3, pourover: 2, pastry: 0, cozy: 0, quick: 3 } },
      { name: "Ogawa Coffee", hood: "Downtown", know: "Latte art, Kyoto roaster",
        blurb: "The Boston outpost of a Kyoto roaster, with a big room downtown and some of the city's best latte art.",
        note: "Watch the baristas pour.", a: { work: 2, espresso: 3, pourover: 2, pastry: 1, cozy: 1, quick: 1 } },
      { name: "George Howell Coffee", hood: "Downtown Crossing", know: "Single-origin pour-overs",
        blurb: "Coffee from one of the people who started the specialty movement in New England. The menu reads like a wine list.",
        note: "Order whatever's on the brew bar that day.", a: { work: 1, espresso: 3, pourover: 3, pastry: 1, cozy: 1, quick: 1 } }
    ] },
  { id: "sacramento", name: "Sacramento", region: "California", tz: "America/Los_Angeles",
    shops: [
      { name: "Offbeat Coffee", hood: "Land Park", know: "Pop-up turned shop",
        blurb: "Started as a pop-up and opened in Land Park in 2025. Owned by Vivian Tran and Thao Nguyen.",
        note: "New and already a local favorite.", a: { work: 1, espresso: 3, pourover: 2, pastry: 1, cozy: 2, quick: 2 } },
      { name: "Milka Coffee Roasters", hood: "Mansion Flats", know: "Downtown roaster",
        blurb: "A downtown roaster and café made in Mansion Flats, with a loyal crowd of regulars.",
        note: "Ask what they roasted this week.", a: { work: 2, espresso: 3, pourover: 2, pastry: 1, cozy: 2, quick: 1 } },
      { name: "Pachamama Coffee", hood: "East Sacramento", know: "Farmer-owned, organic",
        blurb: "A cooperative owned by the farmers who grow the coffee. Everything is organic.",
        note: "The money goes back to the growers.", a: { work: 2, espresso: 2, pourover: 2, pastry: 1, cozy: 1, quick: 2 } },
      { name: "Mast Coffee", hood: "Sacramento", know: "Specialty café",
        blurb: "A well-reviewed independent café with a focused specialty menu.",
        note: "Good espresso, calm room.", a: { work: 2, espresso: 3, pourover: 1, pastry: 1, cozy: 2, quick: 1 } },
      { name: "Temple Coffee Roasters", hood: "Downtown", know: "Hometown roaster",
        blurb: "Sacramento's best-known roaster. Roomy cafés, a long brew menu and plenty of tables.",
        note: "Good spot to sit and work for a few hours.", a: { work: 3, espresso: 2, pourover: 3, pastry: 1, cozy: 1, quick: 1 } }
    ] },
  { id: "nyc", name: "New York", region: "New York", tz: "America/New_York",
    shops: [
      { name: "Coffee Project New York", hood: "East Village", know: "Roaster with a training academy",
        blurb: "A small East Village café from a roaster that also runs a coffee school. Inventive drinks, done carefully.",
        note: "Ask about the signature drinks.", a: { work: 1, espresso: 3, pourover: 3, pastry: 1, cozy: 1, quick: 2 } },
      { name: "Koré Coffee", hood: "Chinatown", know: "Neighborhood specialty café",
        blurb: "A small Chinatown café with one of the highest Yelp ratings in the city.",
        note: "Worth the detour downtown.", a: { work: 1, espresso: 3, pourover: 2, pastry: 1, cozy: 2, quick: 2 } },
      { name: "La Cabra", hood: "East Village", know: "Danish roaster, cardamom buns",
        blurb: "Light-roast coffee from Aarhus, Denmark, with a bakery behind the counter. Copenhagen calm in Manhattan.",
        note: "Cardamom bun and a filter coffee.", a: { work: 0, espresso: 2, pourover: 3, pastry: 3, cozy: 1, quick: 2 } },
      { name: "Culture Espresso", hood: "Midtown West", know: "Espresso and famous cookies",
        blurb: "A Midtown favorite for solid espresso and chocolate chip cookies baked in-house.",
        note: "Get the cookie warm.", a: { work: 1, espresso: 3, pourover: 1, pastry: 3, cozy: 1, quick: 3 } },
      { name: "Sey Coffee", hood: "East Williamsburg", know: "Very light roasts",
        blurb: "An airy roastery with some of the lightest, fruitiest coffee in the city.",
        note: "If you like it bright, this is the one.", a: { work: 1, espresso: 2, pourover: 3, pastry: 0, cozy: 1, quick: 1 } },
      { name: "Devoción", hood: "Williamsburg", know: "Fresh Colombian beans",
        blurb: "Colombian coffee roasted in Brooklyn, served under a big skylight full of plants.",
        note: "Sit under the skylight.", a: { work: 2, espresso: 2, pourover: 2, pastry: 1, cozy: 3, quick: 1 } }
    ] },
  { id: "sf", name: "San Francisco", region: "California", tz: "America/Los_Angeles",
    shops: [
      { name: "The Coffee Movement", hood: "Nob Hill", know: "Small specialty bar",
        blurb: "A tiny bar with a focused menu of carefully made espresso and filter coffee.",
        note: "Small space, big flavor.", a: { work: 0, espresso: 3, pourover: 3, pastry: 0, cozy: 1, quick: 3 } },
      { name: "Hedge Coffee", hood: "Mission", know: "Pop-up turned big room",
        blurb: "Grew from pop-ups into a 4,000 sq ft space on Shotwell Street in 2025.",
        note: "Plenty of room to stay a while.", a: { work: 3, espresso: 2, pourover: 2, pastry: 1, cozy: 2, quick: 1 } },
      { name: "Saint Frank", hood: "Russian Hill", know: "Light, airy room",
        blurb: "White walls, wood and a sunny room on Polk Street. Calm, polished and easy to love.",
        note: "Window seat in the afternoon.", a: { work: 2, espresso: 2, pourover: 2, pastry: 1, cozy: 3, quick: 1 } },
      { name: "Snowbird Coffee", hood: "Inner Sunset", know: "Neighborhood roaster",
        blurb: "A friendly Inner Sunset café, a short walk from Golden Gate Park.",
        note: "Take it to the park.", a: { work: 2, espresso: 2, pourover: 2, pastry: 1, cozy: 2, quick: 2 } },
      { name: "Linea Caffe", hood: "Mission", know: "Organic roaster, espresso bar",
        blurb: "A small corner bar from a veteran organic roaster. Mostly espresso, done very well.",
        note: "Small menu, all good.", a: { work: 0, espresso: 3, pourover: 1, pastry: 1, cozy: 0, quick: 3 } }
    ] },
  { id: "cdmx", name: "Ciudad de México", region: "México", tz: "America/Mexico_City",
    shops: [
      { name: "Qūentin Café", hood: "Condesa", know: "Specialty espresso, banana bread",
        blurb: "One of the cafés that shaped the city's modern specialty scene. Very consistent espresso.",
        note: "Get the banana bread.", a: { work: 1, espresso: 3, pourover: 2, pastry: 2, cozy: 2, quick: 2 } },
      { name: "Buna", hood: "Roma Norte", know: "Mexican roaster",
        blurb: "Roma Norte coffee bar on Orizaba from a roaster that buys Mexican beans and roasts them in the city. Its blends carry Nahuatl names.",
        note: "Buy a bag to take home.", a: { work: 2, espresso: 2, pourover: 3, pastry: 1, cozy: 1, quick: 2 } }
    ] }
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { city: null }; // null = home page
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

const shortName = (c) => ({ cdmx: "CDMX", nyc: "NYC", sf: "SF" }[c.id] || c.name);
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);
function pickView() { state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null; }

/* City tabs with visible scroll affordances */
function renderTabs() {
  const items = [{ id: "home", label: "Home", sel: !state.city }]
    .concat(CITIES.map((c) => ({ id: c.id, label: shortName(c), sel: state.city && state.city.id === c.id })));
  $("tabs").innerHTML = items.map((t) =>
    `<a class="tab" role="tab" id="tab-${t.id}" href="#${t.id}" aria-selected="${!!t.sel}">${t.label}</a>`).join("");
  const active = document.querySelector('.tab[aria-selected="true"]');
  if (active) {
    const sc = $("tabs-scroll");
    const l = active.offsetLeft - sc.offsetLeft, r = l + active.offsetWidth;
    if (l < sc.scrollLeft || r > sc.scrollLeft + sc.clientWidth) sc.scrollLeft = l - 24;
  }
  updateNudges();
}
function updateNudges() {
  const sc = $("tabs-scroll");
  const max = sc.scrollWidth - sc.clientWidth;
  const atStart = sc.scrollLeft <= 2, atEnd = sc.scrollLeft >= max - 2;
  const overflow = max > 2;
  $("nudge-left").hidden = !overflow || atStart;
  $("nudge-right").hidden = !overflow || atEnd;
  sc.style.setProperty("--fade-l", overflow && !atStart ? "28px" : "0px");
  sc.style.setProperty("--fade-r", overflow && !atEnd ? "28px" : "0px");
}
(function wireTabScroll() {
  const sc = $("tabs-scroll");
  sc.addEventListener("scroll", updateNudges, { passive: true });
  window.addEventListener("resize", updateNudges);
  sc.addEventListener("wheel", (e) => {
    if (sc.scrollWidth <= sc.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); sc.scrollLeft += e.deltaY;
  }, { passive: false });
  $("nudge-left").addEventListener("click", () => sc.scrollBy({ left: -160 }));
  $("nudge-right").addEventListener("click", () => sc.scrollBy({ left: 160 }));
})();

/* Intro */
function renderIntro() {
  $("intro-nav").innerHTML = CITIES.map((c) =>
    `<a href="#${c.id}"><span class="full">${esc(c.name)}</span><span class="short">${esc(shortName(c))}</span></a>`).join("");
  const letters = [..."Flâneur"], mid = (letters.length - 1) / 2;
  $("mark").innerHTML = letters.map((ch, i) => {
    const t = (i - mid) / mid;
    return `<span aria-hidden="true" style="--t:${t.toFixed(3)};--b:${(1 - t * t).toFixed(3)}">${esc(ch)}</span>`;
  }).join("");
}

/* City page */
const reveal = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); } });
}, { rootMargin: "0px 0px -6% 0px" }) : null;

function renderCity() {
  const c = state.city;
  $("city-title").textContent = c.name;
  $("shops").innerHTML = c.shops.map((s, i) => `
    <li class="shop" style="--d:${Math.min(i, 6) * 90}ms">
      <a href="${mapsUrl(s, c)}" target="_blank" rel="noopener">
        <span class="nm">${esc(s.name)}</span>
        <span class="meta">${esc(s.hood)} · ${esc(s.know)}</span>
      </a>
    </li>`).join("");
  document.querySelectorAll(".shop").forEach((el) => {
    if (!reveal || reduceMotion.matches) el.classList.add("in"); else reveal.observe(el);
  });
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.body.dataset.view = home ? "home" : "city";
  renderTabs();
  if (!home) renderCity();
}

window.addEventListener("hashchange", () => { pickView(); renderAll(); window.scrollTo(0, 0); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNudges);

pickView();
renderIntro();
renderAll();
</script>
</body>
</html>
