/* Evening: the same rooms with the lights low */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18130F; --surface: #2A221C; --paper: #1E1814; --ink: #F2EADF; --muted: #B3A595; --line: #3A3029;
    --rosa: #6E2F42; --ochre: #6B4A17; --terra: #64382A; --concrete: #3E3A35; --sage: #2E4335;
    --garden: #1D2D21; --garden-deep: #111C14; --pot: #6A3420; --nopal: #2F4A30; --nopal-dark: #243A25;
    --floor: #221B16; --sun-shadow: rgba(0, 0, 0, .28); --plane-shade: rgba(0, 0, 0, .18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18130F; --surface: #2A221C; --paper: #1E1814; --ink: #F2EADF; --muted: #B3A595; --line: #3A3029;
  --rosa: #6E2F42; --ochre: #6B4A17; --terra: #64382A; --concrete: #3E3A35; --sage: #2E4335;
  --garden: #1D2D21; --garden-deep: #111C14; --pot: #6A3420; --nopal: #2F4A30; --nopal-dark: #243A25;
  --floor: #221B16; --sun-shadow: rgba(0, 0, 0, .28); --plane-shade: rgba(0, 0, 0, .18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-sans); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.label { font-size: 14px; letter-spacing: .01em; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Plaster: a flat color with a faint trowel grain */
.plaster { background-color: var(--wall, var(--bg)); background-image: var(--grain); background-size: 180px; }
.terrazzo { background-color: var(--floor); background-image: var(--terrazzo); background-size: 360px; }

/* Sticky header: brand and city tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { font-family: var(--font-serif); font-style: italic; font-size: 27px; line-height: 1; letter-spacing: -.01em; white-space: nowrap; text-decoration: none; }
/* The home page is just the café front: no header, no footer */
body[data-view="home"] .top, body[data-view="home"] footer { display: none; }

.tabs-box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; }
.tabs-scroll { flex: 1; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 4px; margin-bottom: -4px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%); }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; width: max-content; margin-left: auto; }
.tab { border-radius: 999px; padding: 5px 12px; font-size: 15px; white-space: nowrap; text-decoration: none; color: var(--muted); transition: color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.nudge { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1; display: grid; place-items: center; padding: 0; }

/* Views fade in when you switch between home and a city */
main:not([hidden]) { animation: view-in .5s ease both; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } }

/* Leaf shadow: a branch outside the window, blurred, swaying slowly on the plaster */
.sun { position: absolute; pointer-events: none; color: var(--sun-shadow); mix-blend-mode: multiply; transform-origin: 100% 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sun { mix-blend-mode: normal; } }
:root[data-theme="dark"] .sun { mix-blend-mode: normal; }
.sun svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- Home: the café front ----------
   Everything is measured from the sandwich board's height (--bh), so the composition keeps its
   proportions on any screen: a rosa wall with an arch into the garden on the left, a concrete
   pier and a lower ochre wall on the right, a nopal in a clay pot, the board out on the terrazzo. */
.intro { position: relative; height: 100vh; height: 100svh; min-height: 520px; overflow: hidden; --wall: var(--bg);
  --bh: min(54vh, 54svh, 70vw * 766 / 800); --fy: calc(56% + var(--bh) / 2); }
.intro-nav { position: relative; z-index: 3; display: flex; justify-content: space-around; gap: 12px; padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) 0; font-size: 16px; letter-spacing: .01em; }
.intro-nav a { text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 5px; white-space: nowrap; transition: text-decoration-color .2s; }
.intro-nav a:hover, .intro-nav a:focus-visible { text-decoration-color: currentColor; }
.intro-nav .short { display: none; }
.scene, .scene > * { position: absolute; }
.scene { inset: 0; }
.plane { bottom: calc(100% - var(--fy)); }
.plane::after { content: ""; position: absolute; inset: 0; background: var(--plane-shade); }
.wall-rosa { --wall: var(--rosa); left: 0; right: calc(50% - var(--bh) * .04); height: calc(var(--bh) * 1.34); }
/* hard afternoon shadow cutting across the rosa wall */
.wall-rosa::after { clip-path: polygon(100% 0, 100% 100%, calc(100% - var(--bh) * .55) 100%); }
.arch { position: absolute; bottom: 0; right: calc(var(--bh) * .86); width: calc(var(--bh) * .42); height: calc(var(--bh) * .96); border-radius: calc(var(--bh) * .21) calc(var(--bh) * .21) 0 0; overflow: hidden;
  background: linear-gradient(180deg, var(--garden) 0%, var(--garden-deep) 100%); box-shadow: inset calc(var(--bh) * .03) 0 0 var(--plane-shade); }
.arch svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--garden-deep); }
.arch .lit { color: var(--nopal); opacity: .55; }
.pier { --wall: var(--concrete); left: calc(50% + var(--bh) * .66); width: calc(var(--bh) * .3); height: calc(var(--bh) * 1.12); }
.pier::after { clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%); }
.wall-ochre { --wall: var(--ochre); left: calc(50% + var(--bh) * .28); right: 0; height: calc(var(--bh) * .74); }
.wall-ochre::after { clip-path: polygon(0 0, calc(var(--bh) * .38) 0, calc(var(--bh) * .38) 100%, 0 100%); opacity: .7; }
.floor { left: 0; right: 0; top: var(--fy); bottom: 0; }
.floor::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--plane-shade), transparent 40%); }
.nopal { left: calc(50% + var(--bh) * .74); bottom: calc(100% - var(--fy) - var(--bh) * .015); height: calc(var(--bh) * .82); aspect-ratio: 200 / 300; }
.nopal svg { width: 100%; height: 100%; display: block; overflow: visible; }
.intro .sun { top: calc(var(--fy) - var(--bh) * 1.6); right: -4vw; width: max(70vw, calc(var(--bh) * 2.6)); aspect-ratio: 1000 / 420; }
.intro-stage { position: absolute; inset: 0; z-index: 2; }

/* The sandwich board, standing on the floor in front of the café. On first view it draws itself:
   board, back leg, then the name in chalk letter by letter, then the floor line runs edge to edge. */
.board { position: absolute; left: 50%; top: calc(var(--fy) - var(--bh) * 931 / 766); translate: -50% 0; height: var(--bh); aspect-ratio: 800 / 766; container-type: size; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .board { color: #2A221C; } }
:root[data-theme="dark"] .board { color: #2A221C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .board .face { fill: #DCD0BF; } }
:root[data-theme="dark"] .board .face { fill: #DCD0BF; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.board .line { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.board .face { fill: #F4ECE0; stroke: none; }
.board .shadow { fill: var(--sun-shadow); stroke: none; }
.mark { position: absolute; left: 47.5%; top: 53.5%; translate: -50% -78%; margin: 0; color: #221A14;
  font-family: var(--font-hand); font-weight: 400; font-size: 11cqh; line-height: 1; white-space: nowrap;
  -webkit-text-fill-color: transparent; -webkit-text-stroke: .04em currentColor; }
.mark span { display: inline-block; margin-inline: .03em; }
.board-sub { position: absolute; left: 47.5%; top: 63%; translate: -50% 0; margin: 0; color: #4A3B30; font-family: var(--font-hand); font-size: 4.2cqh; line-height: 1.15; text-align: center; white-space: nowrap; }
.street { position: absolute; left: 0; right: 0; top: var(--fy); height: max(1.5px, var(--bh) * 3.6 / 766); translate: 0 -50%; z-index: 1; background: currentColor; color: var(--ink); opacity: .8; }

@media (prefers-reduced-motion: no-preference) {
  .intro:not(.drawn) .board .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-in-out var(--d, 0s) forwards; }
  .intro:not(.drawn) .board .face, .intro:not(.drawn) .board .shadow { opacity: 0; animation: show .35s ease .35s forwards; }
  .intro:not(.drawn) .mark span { opacity: 0; translate: 0 .12em; animation: letter .32s cubic-bezier(.25, 1, .5, 1) calc(.7s + var(--i) * .08s) forwards; }
  .intro:not(.drawn) .board-sub { opacity: 0; animation: show .5s ease 1.4s forwards; }
  .intro:not(.drawn) .street { clip-path: inset(0 calc(50% - var(--bh) * 400 / 766)); animation: stretch .6s cubic-bezier(.16, 1, .3, 1) 1.25s forwards; }
  .sun { animation: sway 11s ease-in-out infinite alternate; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes show { to { opacity: 1; } }
  @keyframes letter { to { opacity: 1; translate: 0 0; } }
  @keyframes stretch { to { clip-path: inset(0 0); } }
  @keyframes sway { from { transform: rotate(-1.2deg) translateX(-6px); } to { transform: rotate(1.4deg) translateX(8px); } }
}

/* ---------- City page: each city is its own room, painted its own color ---------- */
[data-city="boston"] { --room: var(--terra); }
[data-city="sacramento"] { --room: var(--ochre); }
[data-city="nyc"] { --room: var(--concrete); }
[data-city="sf"] { --room: var(--sage); }
[data-city="cdmx"] { --room: var(--rosa); }
.room { --wall: var(--room); position: relative; overflow: hidden; isolation: isolate; }
.room-in { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; min-height: clamp(260px, 42vh, 420px); padding-block: 48px 40px; }
.room-kicker { margin: 0 0 14px; font-size: 15px; color: var(--ink); opacity: .8; }
.room-title { max-width: calc(100% - clamp(140px, 17vw, 210px) - 48px); font-family: var(--font-serif); font-optical-sizing: auto; font-size: clamp(52px, 8vw, 116px); line-height: .92; letter-spacing: -.025em; }
.room-title:focus { outline: none; }
.room-title:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
.room .arch { right: max(20px, calc(50% - 570px)); width: clamp(140px, 17vw, 210px); height: 78%; border-radius: 999px 999px 0 0; z-index: 1; }
.room .sun { top: -30px; right: -60px; width: min(1000px, 90vw); aspect-ratio: 1000 / 420; z-index: 1; }
.room-floor { position: relative; height: 22px; border-top: 1px solid var(--line); }

/* The menu: each café on its own line, the name on the left, what to know on the right.
   Only the name is the link (so screen readers hear a short label), but the whole row is
   clickable through a stretched ::after. */
.shops { list-style: none; margin: 0 auto; padding: 24px 0 88px; max-width: 1040px; counter-reset: shop; }
.shop { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 8px 56px; align-items: start; padding: 36px 0 38px; border-bottom: 1px solid var(--line); counter-increment: shop;
  opacity: 0; transform: translateY(22px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0ms); }
.shop.in { opacity: 1; transform: none; }
.shop a { text-decoration: none; }
.shop a::after { content: ""; position: absolute; inset: 0; }
.shop-head { display: grid; grid-template-columns: 2.6em 1fr; column-gap: 4px; }
.shop-head::before { content: counter(shop, decimal-leading-zero); grid-row: span 2; padding-top: .55em; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.shop h2 { font-weight: 400; }
.shop .nm { display: block; font-family: var(--font-serif); font-optical-sizing: auto; font-size: clamp(32px, 3.8vw, 50px); line-height: 1.02; letter-spacing: -.015em; }
.shop .meta { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
.shop .ext { display: inline-block; margin-left: .3em; font-size: .9em; transition: transform .2s ease; }
.shop-body { padding-top: .5em; }
.shop .blurb { max-width: 48ch; margin: 0; line-height: 1.55; text-wrap: pretty; }
.shop .note { max-width: 44ch; margin: 14px 0 0; padding-left: 14px; border-left: 2px solid var(--room); font-family: var(--font-serif); font-style: italic; font-size: 20px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
/* Only the hovered or focused café changes; the others stay at full strength */
.shop:hover .nm, .shop a:focus-visible .nm { font-style: italic; }
.shop:hover .ext { transform: translate(2px, -2px); }
.shop a:focus-visible { outline: none; }
.shop:has(a:focus-visible) { outline: 2px solid var(--ink); outline-offset: 6px; }

footer { color: var(--muted); }
footer .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 8px 36px; }
.foot-cities { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; }
.foot-cities li + li::before { content: "·"; content: "·" / ""; padding-inline: .5em; }
.foot-cities a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; transition: color .15s, text-decoration-color .15s; }
.foot-cities a:hover, .foot-cities a:focus-visible, .foot-cities a[aria-current="page"] { color: var(--ink); text-decoration-color: currentColor; }
.foot-floor { height: 56px; border-top: 1px solid var(--line); }

@media (max-width: 760px) {
  .top .wrap { flex-wrap: wrap; gap: 6px 12px; }
  .brand { flex: 1; }
  .tabs-box { order: 3; flex-basis: 100%; }
  .tabs { margin-left: 0; }
  .intro { --bh: min(50vh, 50svh, 84vw * 766 / 800); --fy: calc(58% + var(--bh) / 2); }
  .intro-nav { justify-content: space-between; font-size: 15px; }
  .intro-nav .full { display: none; }
  .intro-nav .short { display: inline; }
  .wall-rosa { right: calc(50% - var(--bh) * .2); height: calc(var(--bh) * 1.75); }
  .wall-ochre { height: calc(var(--bh) * 1.05); }
  .pier { height: calc(var(--bh) * 1.4); }
  .arch { right: calc(var(--bh) * .74); }
  .room .arch { display: none; }
  .room-title { max-width: none; }
  .room-in { min-height: 240px; padding-block: 40px 28px; }
  .shops { padding-top: 8px; }
  .shop { grid-template-columns: 1fr; padding-block: 28px 30px; }
  .shop-head { grid-template-columns: 2.2em 1fr; }
  .shop-body { padding: 10px 0 0 2.2em; }
  .shop-head::before { padding-top: .45em; }
  .shop .blurb { font-size: 16px; }
  .shop .note { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  main:not([hidden]) { animation: none !important; }
  .shop { opacity: 1; transform: none; }
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { city: null }; // null = home page
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

const shortName = (c) => ({ cdmx: "CDMX", nyc: "NYC", sf: "SF" }[c.id] || c.name);
const mapsUrl = (s, c) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${s.name} ${s.hood} ${c.name}`);
function pickView() { state.city = CITIES.find((c) => c.id === location.hash.slice(1)) || null; }

/* City tabs with visible scroll affordances */
function renderTabs() {
  const items = [{ id: "home", label: "Home", sel: !state.city }]
    .concat(CITIES.map((c) => ({ id: c.id, label: shortName(c), sel: state.city && state.city.id === c.id })));
  $("tabs").innerHTML = items.map((t) =>
    `<a class="tab" id="tab-${t.id}" href="#${t.id}"${t.sel ? ' aria-current="page"' : ""}>${esc(t.label)}</a>`).join("");
  const active = document.querySelector('.tab[aria-current="page"]');
  if (active) {
    const sc = $("tabs-scroll");
    const l = active.offsetLeft - sc.offsetLeft, r = l + active.offsetWidth;
    if (l < sc.scrollLeft || r > sc.scrollLeft + sc.clientWidth) sc.scrollLeft = l - 24;
  }
  updateNudges();
}
function updateNudges() {
  const sc = $("tabs-scroll");
  const max = sc.scrollWidth - sc.clientWidth;
  const atStart = sc.scrollLeft <= 2, atEnd = sc.scrollLeft >= max - 2;
  const overflow = max > 2;
  $("nudge-left").hidden = !overflow || atStart;
  $("nudge-right").hidden = !overflow || atEnd;
  sc.style.setProperty("--fade-l", overflow && !atStart ? "28px" : "0px");
  sc.style.setProperty("--fade-r", overflow && !atEnd ? "28px" : "0px");
}
(function wireTabScroll() {
  const sc = $("tabs-scroll");
  sc.addEventListener("scroll", updateNudges, { passive: true });
  window.addEventListener("resize", updateNudges);
  sc.addEventListener("wheel", (e) => {
    if (sc.scrollWidth <= sc.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); sc.scrollLeft += e.deltaY;
  }, { passive: false });
  $("nudge-left").addEventListener("click", () => sc.scrollBy({ left: -160 }));
  $("nudge-right").addEventListener("click", () => sc.scrollBy({ left: 160 }));
})();

/* Home */
function renderIntro() {
  $("intro-nav").innerHTML = CITIES.map((c) =>
    `<a href="#${c.id}"><span class="full">${esc(c.name)}</span><span class="short">${esc(shortName(c))}</span></a>`).join("");
  $("mark").innerHTML = [..."Flâneur"].map((ch, i) => `<span aria-hidden="true" style="--i:${i}">${esc(ch)}</span>`).join("");
  // the sign draws itself the first time home is on screen, then stays put on later visits
  $("intro").querySelector(".street").addEventListener("animationend", (e) => {
    if (e.animationName === "stretch") $("intro").classList.add("drawn");
  });
}

/* City page */
const reveal = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); reveal.unobserve(e.target); } });
}, { rootMargin: "0px 0px -6% 0px" }) : null;

function renderCity() {
  const c = state.city;
  const n = c.shops.length;
  $("city-title").textContent = c.name;
  $("room-kicker").textContent = `${c.region} · ${n} ${n === 1 ? "café" : "cafés"}`;
  $("shops").innerHTML = c.shops.map((s, i) => `
    <li class="shop" style="--d:${Math.min(i, 6) * 90}ms">
      <div class="shop-head">
        <h2><a href="${mapsUrl(s, c)}" target="_blank" rel="noopener"><span class="nm">${esc(s.name)}</span><span class="sr-only"> (opens Google Maps in a new tab)</span></a></h2>
        <p class="meta">${esc(s.hood)} · ${esc(s.know)}<span class="ext" aria-hidden="true">↗</span></p>
      </div>
      <div class="shop-body">
        ${s.blurb ? `<p class="blurb">${esc(s.blurb)}</p>` : ""}
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      </div>
    </li>`).join("");
  document.querySelectorAll(".shop").forEach((el) => {
    if (!reveal || reduceMotion.matches) el.classList.add("in"); else reveal.observe(el);
  });
}

function renderAll() {
  const home = !state.city;
  $("home-view").hidden = !home;
  $("city-view").hidden = home;
  document.body.dataset.view = home ? "home" : "city";
  if (home) delete document.body.dataset.city; else document.body.dataset.city = state.city.id;
  document.title = home ? "Flâneur" : `${state.city.name} · Flâneur`;
  renderTabs();
  renderFooter();
  if (!home) renderCity();
}

/* Footer: every city as a real link, the current one marked */
function renderFooter() {
  $("foot-cities").innerHTML = CITIES.map((c) =>
    `<li><a href="#${c.id}"${state.city === c ? ' aria-current="page"' : ""}>${esc(shortName(c))}</a></li>`).join("");
}

window.addEventListener("hashchange", () => {
  pickView(); renderAll(); window.scrollTo(0, 0);
  // no page load happened, so move focus to the new city's heading for keyboard and screen reader users
  if (state.city) $("city-title").focus({ preventScroll: true });
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNudges);

pickView();
renderIntro();
renderAll();

</script>
